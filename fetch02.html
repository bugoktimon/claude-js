<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fetch02</title>
</head>
<body>
    <!-- 이미지 표가 출력될 영역 -->
    <table id="result"></table>

    <script>
        // [1] 재사용 가능한 비동기 함수: 주어진 URL로 GET 요청을 보내고 JSON 데이터를 반환한다.
        //     async로 선언하면 함수 안에서 await를 사용할 수 있고, 반환값은 Promise가 된다.
        async function fetchJson(url) {
            // fetch로 요청을 보내고 응답(Response)이 올 때까지 await로 기다린다.
            const response = await fetch(url);
            // HTTP 상태 코드가 200번대가 아니면(response.ok === false) 에러를 발생시킨다.
            if (!response.ok) {
                throw new Error(`요청 실패: ${response.status}`);
            }
            // 응답 본문을 JSON으로 파싱하여 JavaScript 객체/배열로 반환한다.
            return await response.json();
        }

        // [2] 재사용 가능한 렌더링 함수: 사진 배열을 rows행 cols열의 table로 만들어 container에 출력한다.
        //     동기 함수이므로 데이터만 받으면 어떤 목록에도 다시 사용할 수 있다.
        function renderPhotoGrid(photos, container, rows = 2, cols = 5) {
            // 행마다 tr을 만들고, 각 행에 열 수만큼 td를 채운다.
            for (let r = 0; r < rows; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < cols; c++) {
                    // 전체 사진 배열에서 현재 칸에 해당하는 사진을 꺼낸다.
                    const photo = photos[r * cols + c];
                    const td = document.createElement('td');
                    // 사진이 부족한 경우에도 칸은 유지하기 위해 사진이 있을 때만 img를 넣는다.
                    if (photo) {
                        const img = document.createElement('img');
                        // 썸네일 주소를 src로, 사진 제목을 alt로 지정한다.
                        img.src = photo.thumbnailUrl;
                        img.alt = photo.title;
                        td.appendChild(img);
                    }
                    tr.appendChild(td);
                }
                // 완성된 행을 table에 추가한다.
                container.appendChild(tr);
            }
        }

        // [3] 메인 비동기 함수: 데이터 요청 → 화면 출력 순서로 실행하고 에러를 처리한다.
        //     await로 요청이 끝날 때까지 기다린 뒤 다음 줄을 실행하므로 순서가 보장된다.
        async function main() {
            // 출력 대상 요소를 가져온다.
            const container = document.getElementById('result');
            try {
                // 사진 목록 API에 요청하고 결과를 기다린다.
                const photos = await fetchJson('https://jsonplaceholder.typicode.com/photos');
                // 앞에서부터 10장(2행 × 5열)만 화면에 출력한다.
                renderPhotoGrid(photos.slice(0, 10), container, 2, 5);
            } catch (error) {
                // 네트워크/응답 에러 발생 시 화면에 메시지를 표시한다.
                container.textContent = `에러 발생: ${error.message}`;
            }
        }

        // [4] 페이지가 로드되면 main 함수를 실행한다.
        main();
    </script>
</body>
</html>
